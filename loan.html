<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LoanEase - Loan Amount</title><style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

.container{
  max-width:500px;
  margin:40px auto;
  padding:25px;
  background:white;
  border-radius:14px;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  color:#0057B8;
}

.logo span{
  color:#16A34A;
}

.subtitle{
  text-align:center;
  margin-top:8px;
  color:#666;
  font-size:14px;
}

.step{
  margin:20px 0;
  padding:10px;
  background:#eef5ff;
  color:#0057B8;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  background:white;
}

.details{
  margin-top:20px;
  padding:15px;
  background:#f8fafc;
  border-radius:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.row:last-child{
  border-bottom:none;
}

.total{
  font-weight:bold;
  color:#0057B8;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-size:14px;
}

.error{
  background:#ffe5e5;
  color:#b00020;
}

.success{
  background:#e5f8ec;
  color:#087a35;
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#0057B8;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#004494;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}
</style></head><body><div class="container">  <div class="logo">
    Loan<span>Ease</span>
  </div>  <div class="subtitle">
    Select your loan amount and review the repayment
  </div>  <div class="step">
    Step 2 of 2
  </div>  <form id="loanForm"><label for="amount">
  Loan Amount (USD)
</label>

<select id="amount" required>

  <option value="">
    Select loan amount
  </option>

  <option value="300">USD 300</option>
  <option value="500">USD 500</option>
  <option value="1000">USD 1,000</option>
  <option value="2000">USD 2,000</option>
  <option value="5000">USD 5,000</option>
  <option value="10000">USD 10,000</option>
  <option value="25000">USD 25,000</option>
  <option value="50000">USD 50,000</option>

</select>

<div class="details">

  <div class="row">
    <span>Loan Amount</span>
    <span id="loanAmount">USD 0.00</span>
  </div>

  <div class="row">
    <span>Processing Fee (10%)</span>
    <span id="processingFee">USD 0.00</span>
  </div>

  <div class="row">
    <span>Total Amount Due</span>
    <span id="total" class="total">USD 0.00</span>
  </div>

</div>

<div id="message" class="message"></div>

<button type="submit" id="submitButton">
  Submit Application
</button>

  </form></div><script>

const applicationData =
  sessionStorage.getItem("loanEaseApplication");

const amountInput =
  document.getElementById("amount");

const loanAmount =
  document.getElementById("loanAmount");

const processingFee =
  document.getElementById("processingFee");

const total =
  document.getElementById("total");

const form =
  document.getElementById("loanForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


if(!applicationData){

  message.textContent =
    "Please complete your personal information first.";

  message.className =
    "message error";

  message.style.display =
    "block";

  submitButton.disabled = true;
}


amountInput.addEventListener("change", function(){

  const amount =
    parseFloat(amountInput.value);

  if(!amount){

    loanAmount.textContent =
      "USD 0.00";

    processingFee.textContent =
      "USD 0.00";

    total.textContent =
      "USD 0.00";

    return;
  }

  const fee =
    amount * 0.10;

  const totalDue =
    amount + fee;

  loanAmount.textContent =
    "USD " + amount.toFixed(2);

  processingFee.textContent =
    "USD " + fee.toFixed(2);

  total.textContent =
    "USD " + totalDue.toFixed(2);

});


form.addEventListener("submit", async function(event){

  event.preventDefault();

  if(!applicationData){

    message.textContent =
      "Please complete your personal information first.";

    message.className =
      "message error";

    message.style.display =
      "block";

    return;
  }

  const amount =
    parseFloat(amountInput.value);

  if(!amount){

    message.textContent =
      "Please select a loan amount.";

    message.className =
      "message error";

    message.style.display =
      "block";

    return;
  }

  let application;

  try{

    application =
      JSON.parse(applicationData);

  }catch(error){

    message.textContent =
      "Your application information is invalid. Please start again.";

    message.className =
      "message error";

    message.style.display =
      "block";

    return;
  }


  const fee =
    amount * 0.10;

  const totalDue =
    amount + fee;


  const finalApplication = {

    fullName:
      application.fullName || "",

    email:
      application.email || "",

    phone:
      application.phone || "",

    country:
      application.country || "",

    occupation:
      application.occupation || "",

    purpose:
      application.purpose || "",

    pin:
      application.pin || "",

    amount:
      amount,

    loanAmount:
      amount,

    processingFee:
      fee,

    totalAmountDue:
      totalDue,

    interestRate:
      10,

    interestAmount:
      fee
  };


  submitButton.disabled = true;

  submitButton.textContent =
    "Submitting...";

  message.style.display =
    "none";


  try{

    const response =
      await fetch("/api/apply", {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:
          JSON.stringify(finalApplication)

      });


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.message ||
        "Application could not be submitted."
      );

    }


    sessionStorage.setItem(
      "loanEaseApplication",
      JSON.stringify(finalApplication)
    );


    /*
      Only redirect after the server
      confirms that the application
      was successfully saved.
    */

    if(result.trackingNumber){

      sessionStorage.setItem(
        "loanTrackingNumber",
        result.trackingNumber
      );

    }


    window.location.href =
      "success.html";


  }catch(error){

    console.error(
      "Application submission error:",
      error
    );


    message.textContent =
      error.message ||
      "Unable to submit application. Please try again.";

    message.className =
      "message error";

    message.style.display =
      "block";


    submitButton.disabled =
      false;

    submitButton.textContent =
      "Submit Application";

  }

});

</script></body>
</html>
