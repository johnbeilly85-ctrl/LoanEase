<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LoanEase - Loan Details</title><style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0057B8,#16A34A);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:20px;
  padding:28px 22px;
  box-shadow:0 12px 35px rgba(0,0,0,0.22);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  color:#0057B8;
  margin-bottom:6px;
}

.logo span{
  color:#16A34A;
}

.subtitle{
  text-align:center;
  color:#666;
  font-size:14px;
  margin-bottom:20px;
}

.step{
  text-align:center;
  color:#0057B8;
  font-weight:bold;
  margin-bottom:22px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
  color:#333;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  background:#fff;
  outline:none;
}

select:focus{
  border-color:#0057B8;
}

.details{
  margin-top:22px;
  background:#f4f8fc;
  border-radius:12px;
  padding:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.row:last-child{
  border-bottom:none;
}

.row span:first-child{
  color:#555;
}

.row span:last-child{
  font-weight:bold;
  color:#222;
  text-align:right;
}

.total{
  font-size:19px;
  color:#0057B8 !important;
}

button{
  width:100%;
  padding:15px;
  margin-top:24px;
  border:none;
  border-radius:9px;
  background:#0057B8;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#004494;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-size:14px;
}

.error{
  background:#ffe5e5;
  color:#b00020;
}
</style></head><body><div class="container">  <div class="logo">
    Loan<span>Ease</span>
  </div>  <div class="subtitle">
    Select your loan amount and review the repayment
  </div>  <div class="step">
    Step 2 of 2
  </div>  <form id="loanForm"><label for="amount">
  Loan Amount (USD)
</label>

<select id="amount" required>

  <option value="">
    Select loan amount
  </option>

  <option value="300">
    USD 300
  </option>

  <option value="500">
    USD 500
  </option>

  <option value="1000">
    USD 1,000
  </option>

  <option value="2000">
    USD 2,000
  </option>

  <option value="5000">
    USD 5,000
  </option>

  <option value="10000">
    USD 10,000
  </option>

  <option value="25000">
    USD 25,000
  </option>

  <option value="50000">
    USD 50,000
  </option>

</select>

<div class="details">

  <div class="row">
    <span>Loan Amount</span>
    <span id="loanAmount">USD 0.00</span>
  </div>

  <div class="row">
    <span>Interest Rate</span>
    <span>10%</span>
  </div>

  <div class="row">
    <span>Interest Amount</span>
    <span id="interest">USD 0.00</span>
  </div>

  <div class="row">
    <span>Total Amount to Return</span>
    <span id="total" class="total">USD 0.00</span>
  </div>

</div>

<div id="message" class="message error"></div>

<button type="submit" id="submitButton">
  Submit Application
</button>

  </form></div><script>

const applicationData =
  sessionStorage.getItem("loanEaseApplication");

const amountInput =
  document.getElementById("amount");

const loanAmount =
  document.getElementById("loanAmount");

const interest =
  document.getElementById("interest");

const total =
  document.getElementById("total");

const form =
  document.getElementById("loanForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


/*
  Make sure the applicant completed Page 1.
*/

if(!applicationData){

  message.textContent =
    "Please complete your personal information first.";

  message.style.display = "block";

  submitButton.disabled = true;
}


/*
  Calculate the 10% interest.
*/

amountInput.addEventListener("change", function(){

  const amount =
    parseFloat(amountInput.value);

  if(!amount){

    loanAmount.textContent = "USD 0.00";
    interest.textContent = "USD 0.00";
    total.textContent = "USD 0.00";

    return;
  }

  const interestAmount =
    amount * 0.10;

  const totalAmount =
    amount + interestAmount;

  loanAmount.textContent =
    "USD " + amount.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

  interest.textContent =
    "USD " + interestAmount.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

  total.textContent =
    "USD " + totalAmount.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

});


/*
  Save the selected loan information
  and move to the confirmation page.
*/

form.addEventListener("submit", function(event){

  event.preventDefault();

  if(!applicationData){

    message.textContent =
      "Please complete Page 1 first.";

    message.style.display = "block";

    return;
  }

  const amount =
    parseFloat(amountInput.value);

  if(!amount){

    message.textContent =
      "Please select a loan amount.";

    message.style.display = "block";

    return;
  }

  const interestAmount =
    amount * 0.10;

  const totalAmount =
    amount + interestAmount;


  const application =
    JSON.parse(applicationData);


  application.loanAmount =
    amount;

  application.interestRate =
    10;

  application.interestAmount =
    interestAmount;

  application.totalAmount =
    totalAmount;


  sessionStorage.setItem(
    "loanEaseApplication",
    JSON.stringify(application)
  );


  window.location.href =
    "success.html";

});

</script></body>
</html>
